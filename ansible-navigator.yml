---
# Local navigator only. Cloud AAP ignores this file and uses the Job Template EE
# plus collections/requirements.yml.
ansible-navigator:
  ansible:
    config:
      path: ansible.cfg
  execution-environment:
    image: aap.rh.lab/ee-network-aci:1.0
    pull:
      policy: missing
  playbook-artifact:
    enable: false
